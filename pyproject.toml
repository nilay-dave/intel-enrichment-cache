[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-enrichment-cache"
version = "0.1.0"
description = "Rate limit aware threat intel client with caching, request coalescing and quota aware hedging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["threat-intelligence", "rate-limiting", "caching", "api-client", "soar", "enrichment", "soc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.6", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/__GITHUB_USERNAME__/intel-enrichment-cache"
Documentation = "https://__GITHUB_USERNAME__.github.io/intel-enrichment-cache/"
Issues = "https://github.com/__GITHUB_USERNAME__/intel-enrichment-cache/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
# A leaked SQLite handle fails the suite rather than printing a warning nobody
# reads. Two real bugs were found by chasing these: close() released only the
# calling thread's connection, and three tests used a Connection as a context
# manager, which commits a transaction and does not close anything.
filterwarnings = [
  "error::ResourceWarning",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
