site_name: intel enrichment cache
site_description: Rate limit aware threat intel client with caching, coalescing and quota aware hedging.
repo_url: https://github.com/__GITHUB_USERNAME__/intel-enrichment-cache
repo_name: __GITHUB_USERNAME__/intel-enrichment-cache
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Overview: index.md
  - Measurements: measurements.md
  - Where the numbers come from: sources.md
  - Limitations: limitations.md
  - Decisions:
      - Cache lifetime: adr/adr-001-cache-lifetime.md
      - SQLite not Redis: adr/adr-002-sqlite-not-redis.md
      - Benchmark harness: adr/adr-003-benchmark-harness.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
