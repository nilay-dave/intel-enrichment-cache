name: Bug report
description: Wrong verdict, wrong request count, a hang, or a crash.
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options:
        - More provider requests were made than expected
        - A verdict was wrong or stale
        - A provider returned 429, so the local limiter was too generous
        - Something hung or deadlocked
        - A crash
        - Something else
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The smallest code that shows it
      description: >
        Including how the client was constructed: the providers, the presets or
        rates, the lifetime policy and the hedge policy. Most surprising
        request counts come from one of those rather than from the indicator.
      render: python
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: client.stats after the run
      description: >
        This is the most useful single thing you can paste. It separates a
        cache that is not working from a coalescer that is not working from a
        provider that is refusing, and those have nothing to do with each
        other.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -c "import iec; print(iec.__version__)"`.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version

  - type: checkboxes
    id: keys
    attributes:
      label: Before you post
      options:
        - label: I have removed any API key from the code and the output above
          required: true
